services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      whatsapp-web:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET: ${APP_SECRET:?Defina APP_SECRET no .env}
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: atende_ia
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v26.0}
      META_APP_SECRET: ${META_APP_SECRET:-}
      WHATSAPP_WEB_SERVICE_URL: http://whatsapp-web:3002
      WHATSAPP_WEB_SECRET: ${WHATSAPP_WEB_SECRET:?Defina WHATSAPP_WEB_SECRET no .env}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-admin@atendeia.com}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-false}
      DEMO_OWNER_EMAIL: ${DEMO_OWNER_EMAIL:-demo@atendeia.com}
      DEMO_OWNER_PASSWORD: ${DEMO_OWNER_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: sh -c "python seed.py && uvicorn server:app --host 0.0.0.0 --port 8001"

  whatsapp-web:
    build:
      context: .
      dockerfile: whatsapp-web/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3002
      WHATSAPP_WEB_SECRET: ${WHATSAPP_WEB_SECRET:?Defina WHATSAPP_WEB_SECRET no .env}
      BACKEND_CALLBACK_URL: http://backend:8001/api/whatsapp/web/inbound
      AUTH_ROOT: /data/auth
    init: true
    stop_grace_period: 150s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health',{headers:{'x-atende-internal-secret':process.env.WHATSAPP_WEB_SECRET}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - whatsapp_auth:/data/auth

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-80}:80"

volumes:
  mongo_data:
  whatsapp_auth:
